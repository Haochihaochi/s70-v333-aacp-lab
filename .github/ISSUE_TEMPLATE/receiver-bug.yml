name: Android Auto receiver bug
about: Report a reproducible receiver-layer issue
labels: [receiver]
body:
  - type: input
    id: commit
    attributes:
      label: Open Headunit commit
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: S70 software/hardware version
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Android 9 reference device
        - Bench S70 IHU
        - Parked S70
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
