name: Import prepared S70 v333 foundation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-foundation:
    if: github.repository == 'Haochihaochi/s70-v333-aacp-lab'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4

      - name: Reconstruct, verify, and import repository
        shell: bash
        env:
          EXPECTED_BUNDLE_SHA256: 0350a26adc1b56515cc26720238eb7e66a6a45f97278161a429505b2074ff50b
          EXPECTED_HEAD: 615e06da449984159cf4f3bd2d5f0e86343b3ea1
          EXPECTED_TAG_COMMIT: 615e06da449984159cf4f3bd2d5f0e86343b3ea1
          EXPECTED_SUBMODULE: 2f07eeec18d3357e865e761ec76423943dfd880e
        run: |
          set -euo pipefail

          cat \
            .foundation-import/corrected/part00.* \
            .foundation-import/bundle.part.01 \
            .foundation-import/bundle.part.02 \
            .foundation-import/bundle.part.03 \
            .foundation-import/bundle.part.04 \
            .foundation-import/bundle.part.05 \
            .foundation-import/corrected/part06.* \
            > /tmp/s70-v333-aacp-lab.bundle.b64

          test "$(wc -c < /tmp/s70-v333-aacp-lab.bundle.b64)" -eq 44012
          base64 --decode /tmp/s70-v333-aacp-lab.bundle.b64 > /tmp/s70-v333-aacp-lab.bundle
          echo "${EXPECTED_BUNDLE_SHA256}  /tmp/s70-v333-aacp-lab.bundle" | sha256sum --check --strict

          mkdir /tmp/bundle-verifier
          git -C /tmp/bundle-verifier init --quiet
          git -C /tmp/bundle-verifier bundle verify /tmp/s70-v333-aacp-lab.bundle

          git clone --quiet /tmp/s70-v333-aacp-lab.bundle /tmp/foundation-source
          test "$(git -C /tmp/foundation-source rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test "$(git -C /tmp/foundation-source rev-parse 'refs/tags/v0.1.0-foundation^{commit}')" = "${EXPECTED_TAG_COMMIT}"
          test "$(git -C /tmp/foundation-source ls-tree HEAD third_party/open-headunit | awk '{print $1}')" = "160000"
          test "$(git -C /tmp/foundation-source ls-tree HEAD third_party/open-headunit | awk '{print $3}')" = "${EXPECTED_SUBMODULE}"

          CURRENT_HEAD="$(git rev-parse HEAD)"
          IMPORTER_BLOB="$(git rev-parse HEAD:.github/workflows/import-foundation.yml)"

          git fetch --quiet /tmp/s70-v333-aacp-lab.bundle refs/heads/main:refs/remotes/foundation/main
          SOURCE_HEAD="$(git rev-parse refs/remotes/foundation/main)"
          test "${SOURCE_HEAD}" = "${EXPECTED_HEAD}"

          git read-tree "${SOURCE_HEAD}"
          while IFS= read -r workflow_path; do
            git update-index --force-remove "${workflow_path}"
          done < <(git ls-tree -r --name-only "${SOURCE_HEAD}" .github/workflows)

          git update-index --add --cacheinfo "100644,${IMPORTER_BLOB},.github/workflows/import-foundation.yml"
          NEW_TREE="$(git write-tree)"

          test "$(git ls-tree "${NEW_TREE}" third_party/open-headunit | awk '{print $1}')" = "160000"
          test "$(git ls-tree "${NEW_TREE}" third_party/open-headunit | awk '{print $3}')" = "${EXPECTED_SUBMODULE}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          NEW_COMMIT="$(printf '%s\n' 'feat: import S70 v333 AACP foundation' | git commit-tree "${NEW_TREE}" -p "${CURRENT_HEAD}")"

          git push origin "${NEW_COMMIT}:refs/heads/main"
