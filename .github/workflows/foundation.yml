name: Foundation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Repository guard
        run: python tools/repo_guard.py
      - name: Bash syntax
        run: bash -n scripts/*.sh scripts/lib/*.sh .githooks/pre-commit
