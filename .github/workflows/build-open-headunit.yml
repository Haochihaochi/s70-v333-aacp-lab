name: Build pinned Open Headunit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.gitmodules'
      - 'config/upstream.env'
      - 'scripts/build-open-headunit.sh'
      - 'third_party/open-headunit'
      - '.github/workflows/build-open-headunit.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-36' 'cmake;3.22.1' 'ndk;29.0.14206865'
      - name: Build
        run: ./scripts/build-open-headunit.sh
      - uses: actions/upload-artifact@v4
        with:
          name: open-headunit-s70-v333-foundation-debug
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
