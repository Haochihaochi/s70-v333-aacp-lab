name: Tag foundation snapshot

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    if: github.repository == 'Haochihaochi/s70-v333-aacp-lab'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create foundation tag
        env:
          TARGET_SHA: 87c7bc32282399e99d2c42c5ee7dc922b5326f2e
          TAG_NAME: v0.1.0-foundation
        run: |
          set -euo pipefail
          git cat-file -e "${TARGET_SHA}^{commit}"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "Tag ${TAG_NAME} already exists; leaving it unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG_NAME}" "${TARGET_SHA}" -m 'S70 v333 AACP foundation v0.1.0'
          git push origin "refs/tags/${TAG_NAME}"
